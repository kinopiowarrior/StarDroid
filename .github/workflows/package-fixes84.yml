name: Package StarDroid fix candidate
on:
  push:
    branches: [codex/dunes-detectors-1.1-build84]
    paths: ['.github/workflows/package-fixes84.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify freshly compiled native libraries
        run: |
          python3 - <<'PY'
          import hashlib,json,pathlib
          r=pathlib.Path('.')
          report=json.loads((r/'NATIVE-BUILD-84.json').read_text())
          for name,digest in report['sha256'].items():
            assert hashlib.sha256((r/name).read_bytes()).hexdigest()==digest, name
          print('Verified native source commit:',report['sourceCommit'])
          PY
      - name: Prepare Android SDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
          mkdir -p "$RUNNER_TEMP/stardroid-tools"
          ln -s "$ANDROID_HOME/platforms/android-35" "$RUNNER_TEMP/stardroid-tools/android-35"
          ln -s "$ANDROID_HOME/build-tools/35.0.0" "$RUNNER_TEMP/stardroid-tools/android-15"
      - name: Build APK and run Android lint
        env:
          STARDROID_ANDROID_TOOLS: ${{ runner.temp }}/stardroid-tools
        run: python3 scripts/build_nearby.py --skip-engine --lint
      - name: Upload candidate for local release signing
        uses: actions/upload-artifact@v4
        with:
          name: StarDroid-1.1-build84-candidate
          path: dist/StarDroid-1.1.apk
          retention-days: 7
      - name: Save candidate on isolated build branch
        run: |
          cp dist/StarDroid-1.1.apk distribution/StarDroid-1.1-build84-candidate.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add distribution/StarDroid-1.1-build84-candidate.apk
          git commit -m "Store APK candidate for local release signing [skip ci]"
          git push origin HEAD:codex/dunes-detectors-1.1-build84
