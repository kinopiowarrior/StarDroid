name: Recover original EUD regression maps
on:
  push:
    branches: [codex/eud96-toolchain-recovery]
permissions:
  contents: read
jobs:
  maps:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download unchanged original regression maps
        run: |
          set -eu
          mkdir maps
          python3 - <<'PY'
          import urllib.request,hashlib,pathlib
          rows=[('xk9hpy5k','2820764216c977be3d0d3c737da3d0ada93365ea2bb61883b7d885e604c30730'),('G4Dqc2dr','13480c334896eeaab3851274915ea00460f58d9a618fa77272d1297b3ac3234b'),('r3h3hgy5','5d9b88704466e1bb0a47f776f87f5213d367823956ab52d2dac9a3c0f2567a4f'),('dDzjhH8B','44946e16d571e8a6922e3bdbe20e8f9f171a35a2bdb0ed7d2020565398e33167'),('97RxyDYs','6b360631a890d7db14f25cfb28723fb1379559fecb63eebde13f27a02d9500fa')]
          for name,digest in rows:
              with urllib.request.urlopen('https://scmscx.com/api/maps/'+digest,timeout=60) as r:data=r.read(16000000)
              assert hashlib.sha256(data).hexdigest()==digest,name
              pathlib.Path('maps',name+'.scx').write_bytes(data)
              print(name,len(data),digest)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: eud96-original-maps
          path: maps/*.scx
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
