name: Recover remaining pinned EUD96 tools
on:
  push:
    branches: [codex/eud96-toolchain-recovery]
permissions:
  contents: read
jobs:
  ndk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download, verify and split official NDK
        run: |
          set -eu
          curl --fail --location --retry 3 --output android-ndk-r27d-linux.zip https://dl.google.com/android/repository/android-ndk-r27d-linux.zip
          printf '%s\n' '22105e410cf29afcf163760cc95522b9fb981121  android-ndk-r27d-linux.zip' | sha1sum --check --strict
          split -b 350000000 -d android-ndk-r27d-linux.zip ndk-part
          sha256sum android-ndk-r27d-linux.zip ndk-part* > ndk-sha256.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: eud96-ndk-part00
          path: |
            ndk-part00
            ndk-sha256.txt
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: eud96-ndk-part01
          path: ndk-part01
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
  jdk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download and verify official JDK17
        run: |
          set -eu
          curl --fail --location --retry 3 --output jdk17.tar.gz https://github.com/adoptium/temurin17-binaries/releases/download/jdk-17.0.21%2B9/OpenJDK17U-jdk_x64_linux_hotspot_17.0.21_9.tar.gz
          printf '%s\n' '8b9b611d917e3dfd8419d3566b5949226f69b052fed7e109c1368add1dfe8711  jdk17.tar.gz' | sha256sum --check --strict
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: eud96-jdk17
          path: jdk17.tar.gz
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
