plugins { id 'com.android.application' }
// Keep release signing material outside the repository. An ordinary checkout
// produces a development-signed APK; the distributed release uses the private key.
def releaseKeyPath = System.getenv('STARDROID_KEYSTORE')
if (releaseKeyPath) {
    ['STARDROID_STORE_PASSWORD', 'STARDROID_KEY_ALIAS', 'STARDROID_KEY_PASSWORD'].each { name ->
        if (!System.getenv(name)) throw new GradleException("Set ${name} when STARDROID_KEYSTORE is configured")
    }
}
android {
    namespace 'org.openbw.androidtest'
    compileSdk 35
    buildToolsVersion '35.0.0'
    defaultConfig { applicationId 'org.openbw.androidtest'; minSdk 26; targetSdk 35; versionCode 84; versionName '1.1' }
    buildFeatures { buildConfig true }
    signingConfigs {
        if (releaseKeyPath) {
            releaseKey {
                storeFile rootProject.file(releaseKeyPath)
                storePassword System.getenv('STARDROID_STORE_PASSWORD')
                keyAlias System.getenv('STARDROID_KEY_ALIAS')
                keyPassword System.getenv('STARDROID_KEY_PASSWORD')
                storeType System.getenv('STARDROID_STORE_TYPE') ?: 'PKCS12'
            }
        }
    }
    buildTypes { release { minifyEnabled false; signingConfig releaseKeyPath ? signingConfigs.releaseKey : signingConfigs.debug } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
    sourceSets { main { jniLibs.srcDirs = ['../native-libs']; assets.srcDirs = ['../build-native/apk-assets'] } }
    packaging { jniLibs { useLegacyPackaging true } }
    lint { abortOnError true }
}
// Multiplayer uses Android framework Bluetooth and Wi-Fi Direct only.
dependencies {}
